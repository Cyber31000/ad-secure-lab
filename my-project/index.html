<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo Album Organizer</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-title" id="view-title">Albums</h1>
      <div class="spacer"></div>
      <div id="header-actions"></div>
    </header>

    <div id="error-banner" class="error-banner" hidden role="alert"></div>

    <main id="view" aria-labelledby="view-title"></main>

    <!-- Reorder announcements for screen readers (FR-008, SC-007). -->
    <div id="live-region" class="visually-hidden" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
